<body>
    <h1>Model (Modelo) no MVC</h1>
    <p>O <strong>Model</strong> representa a camada de dados da aplicação. Ele gerencia a lógica de negócios, as regras e a interação com o banco de dados.
        
    <h2>Principais funções do Model</h2>
        <ul>
            <li>Armazena e gerencia os dados.</li>
            <li>Executa regras de negócios.</li>
            <li>Interage com o banco de dados.</li>
        </ul>
